name: build

# Сборка и тесты LogHub на каждый push и каждый Pull Request.
# Лабораторная работа с красным CI на проверку не принимается.

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Восстановление пакетов
        run: dotnet restore LogHub/LogHub.slnx

      - name: Сборка (предупреждения считаются ошибками)
        run: dotnet build LogHub/LogHub.slnx --no-restore --configuration Release --no-incremental -warnaserror

      - name: Тесты
        run: dotnet test LogHub/LogHub.slnx --no-build --configuration Release --verbosity normal